# nginx in front of the HiveMQ Control Center, so it can be reached from
# anywhere over HTTPS (decision 2026-11-17). Install as
# /etc/nginx/sites-available/hivemq-cc and link into sites-enabled.
#
# Layers, outermost first:
#   1. Azure NSG: 443 open; 8080 is NOT (the Control Center listens on the
#      VM's 127.0.0.1 only, see the docker run in README.md).
#   2. TLS 1.2+/1.3 with the Let's Encrypt certificate for the broker name.
#   3. HTTP basic auth (/etc/nginx/.htpasswd-cc): a second, separate password.
#   4. Rate limiting, so password guessing is slow.
#   5. The Control Center's own login (config.xml <control-center><users>).
# The Control Center can disconnect clients, including the aircraft: keep both
# passwords long and unique.

limit_req_zone $binary_remote_addr zone=hivemq_cc:10m rate=10r/s;

map $http_upgrade $hivemq_cc_connection {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name hivemq-broker.southafricanorth.cloudapp.azure.com;

    ssl_certificate     /etc/letsencrypt/live/hivemq-broker.southafricanorth.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hivemq-broker.southafricanorth.cloudapp.azure.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    auth_basic "Denel MQTT admin";
    auth_basic_user_file /etc/nginx/.htpasswd-cc;

    location / {
        limit_req zone=hivemq_cc burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # The Control Center UI keeps a live connection open.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hivemq_cc_connection;
        proxy_read_timeout 3600s;
    }
}
